<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제주 카페 에이전트</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: sans-serif;
    background: #eef6f5;
    color: #26323a;
    height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 640px;
    margin-inline: auto;
    background: #fff;
  }
  header {
    background: #ff9f4a;
    color: #fff;
    padding: 14px 16px;
    font-weight: bold;
    font-size: 1.1rem;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #fff5e8;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .me { align-self: flex-end; background: #ffd89a; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #fff; border-bottom-left-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  form {
    display: flex;
    gap: 8px;
    padding: 10px;
    border-top: 1px solid #ddd;
    background: #fff;
  }
  #input { flex: 1; padding: 10px 12px; font-size: 1rem; border: 1px solid #bbb; border-radius: 20px; }
  button { padding: 10px 18px; font-size: 1rem; border: 0; border-radius: 20px; background: #ff9f4a; color: #fff; cursor: pointer; }
  .note { text-align: center; font-size: .75rem; color: #888; padding: 0 0 8px; background: #fff; }
</style>
</head>
<body>
  <header>☕ 제주 카페 에이전트</header>

  <div id="chat"></div>

  <form id="form">
    <input id="input" type="text" placeholder="메시지를 입력하세요" autocomplete="off">
    <button type="submit">보내기</button>
  </form>
  <div class="note">※ 지금 답변은 미리 정해 둔 가짜 답이에요.</div>

<script>
  const REPLIES = [
    '안녕하세요! 제주도 괜찮은 카페를 찾아드리는 에이전트예요 ☕ 카페에서 가장 중요하게 생각하는 건 뭐예요? 분위기, 아니면 음료와 디저트 맛?',
    '분위기를 중요하게 보신다면 애월 해안도로의 바다가 보이는 감성 카페를 둘러보는 건 어때요? 🌊',
    '아직 공부 중이에요! 5일차에 진짜로 알아볼게요.'
  ];
  let turn = 0;

  const chat = document.getElementById('chat');
  const input = document.getElementById('input');

  function addBubble(text, who) {
    const el = document.createElement('div');
    el.className = 'bubble ' + who;
    el.textContent = text;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
  }

  // form submit 으로 처리하면 버튼 클릭과 Enter(한글 입력 중 포함)가 한 번씩만 동작한다
  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addBubble(text, 'me');
    input.value = '';
    const reply = REPLIES[turn % REPLIES.length];
    turn++;
    setTimeout(() => addBubble(reply, 'bot'), 1000);
  });

  input.focus();
</script>
</body>
</html>
