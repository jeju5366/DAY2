<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이미지 슬라이드</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; background: #f2f5f8; color: #223; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { margin: 0 0 12px; font-size: 1.5rem; }
  .form { display: flex; gap: 8px; margin-bottom: 12px; }
  #q { flex: 1; padding: 8px 10px; font-size: 1rem; border: 1px solid #bbb; border-radius: 6px; }
  button { padding: 8px 16px; font-size: 1rem; border: 0; border-radius: 6px; background: #2b7de9; color: #fff; cursor: pointer; }
  button:disabled { background: #aab; cursor: default; }
  #msg { min-height: 1.5em; color: #c0392b; margin-bottom: 8px; }
  .viewport { overflow: hidden; border-radius: 10px; }
  .page { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .page img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; display: block; background: #dde; }
  .slide-next { animation: inRight .35s ease; }
  .slide-prev { animation: inLeft .35s ease; }
  @keyframes inRight { from { transform: translateX(60px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes inLeft  { from { transform: translateX(-60px); opacity: 0; } to { transform: none; opacity: 1; } }
  .nav { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 14px; }
  #info { min-width: 180px; text-align: center; }
  .credit { margin-top: 24px; font-size: .85rem; color: #667; text-align: center; }
  .credit a { color: #2b7de9; }
  @media (max-width: 700px) { .page { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>🖼️ 이미지 슬라이드</h1>

  <div class="form">
    <input id="q" type="text" placeholder="검색어를 입력하세요 (예: 제주 바다)">
    <button id="search">검색</button>
  </div>
  <div id="msg"></div>

  <div class="viewport"><div class="page" id="page"></div></div>

  <div class="nav">
    <button id="prev" disabled>◀ 이전 10개</button>
    <span id="info">검색어를 입력해 주세요</span>
    <button id="next" disabled>다음 10개 ▶</button>
  </div>

  <p class="credit">이미지 출처: <a href="https://pixabay.com" target="_blank" rel="noopener">Pixabay</a></p>
</div>

<script>
  const PER_PAGE = 10;
  const MAX_HITS = 500; // Pixabay API 한도
  const $ = id => document.getElementById(id);
  let state = { q: '', page: 1, total: 0 };

  async function load(page, direction) {
    const q = $('q').value.trim();
    if (!q) { $('msg').textContent = '검색어를 입력해 주세요.'; return; }
    $('msg').textContent = '';
    ['prev', 'next', 'search'].forEach(i => $(i).disabled = true);
    try {
      // API Key는 서버(/api/pixabay)가 환경변수로 가지고 있어서 브라우저에는 없다.
      const res = await fetch('/api/pixabay?' + new URLSearchParams({ q, page }));
      if (!res.ok) {
        const detail = (await res.text()).slice(0, 150);
        throw new Error(res.status === 429 ? '요청이 너무 많아요. 잠시 후 다시 시도해 주세요.'
          : '오류가 발생했어요 (' + res.status + ') ' + detail);
      }
      const data = await res.json();
      state = { q, page, total: Math.min(data.totalHits, MAX_HITS) };
      render(data.hits, direction);
    } catch (e) {
      $('msg').textContent = e.message;
    } finally {
      $('search').disabled = false;
      updateNav();
    }
  }

  function render(hits, direction) {
    const el = $('page');
    el.className = 'page';
    el.innerHTML = '';
    if (!hits.length) { $('msg').textContent = '검색 결과가 없어요.'; return; }
    hits.forEach(h => {
      const a = document.createElement('a');
      a.href = h.pageURL; a.target = '_blank'; a.rel = 'noopener';
      const img = document.createElement('img');
      img.src = h.webformatURL; img.alt = h.tags; img.title = h.tags; img.loading = 'lazy';
      a.appendChild(img);
      el.appendChild(a);
    });
    void el.offsetWidth; // 애니메이션 재시작
    el.classList.add(direction === 'prev' ? 'slide-prev' : 'slide-next');
  }

  function updateNav() {
    const lastPage = Math.max(1, Math.ceil(state.total / PER_PAGE));
    $('prev').disabled = state.page <= 1;
    $('next').disabled = state.page >= lastPage || !state.total;
    if (state.total) $('info').textContent = state.page + ' / ' + lastPage + ' 페이지 (총 ' + state.total + '장)';
  }

  $('search').onclick = () => load(1, 'next');
  $('q').addEventListener('keydown', e => { if (e.key === 'Enter') load(1, 'next'); });
  $('prev').onclick = () => load(state.page - 1, 'prev');
  $('next').onclick = () => load(state.page + 1, 'next');
</script>
</body>
</html>
